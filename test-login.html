<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login API - Mbita Emmanuel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .code {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
            overflow-x: auto;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #333;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Login API</h1>
        <p class="subtitle">Test the admin login endpoint after Prisma fix</p>
        
        <div class="info-box">
            <strong>📌 Default Credentials:</strong><br>
            Username: <code>Mbita</code><br>
            Password: <code>mbita@!12345</code>
        </div>

        <form id="loginForm">
            <label for="apiUrl">API Endpoint URL:</label>
            <input 
                type="text" 
                id="apiUrl" 
                value="https://mbita-emmanuel.vercel.app/api/auth/login"
                placeholder="https://mbita-emmanuel.vercel.app/api/auth/login"
            >

            <label for="username">Username:</label>
            <input 
                type="text" 
                id="username" 
                value="Mbita"
                placeholder="Enter username"
                required
            >

            <label for="password">Password:</label>
            <input 
                type="password" 
                id="password" 
                value="mbita@!12345"
                placeholder="Enter password"
                required
            >

            <button type="submit" id="submitBtn">
                🚀 Test Login
            </button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const apiUrl = document.getElementById('apiUrl').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Reset result
            resultDiv.style.display = 'none';
            resultDiv.className = 'result';
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Testing...';

            try {
                const startTime = Date.now();
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include' // Important for cookies
                });

                const endTime = Date.now();
                const responseTime = endTime - startTime;
                const data = await response.json();

                // Show result
                resultDiv.style.display = 'block';
                
                if (response.ok && data.message === 'Login successful.') {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ SUCCESS!</strong><br>
                        Login API is working correctly.<br>
                        <small>Response time: ${responseTime}ms</small>
                        <div class="code">${JSON.stringify(data, null, 2)}</div>
                        <p style="margin-top: 15px;">
                            <strong>Next Step:</strong> 
                            <a href="https://mbita-emmanuel.vercel.app/admin" target="_blank" style="color: #155724;">
                                Open Admin Panel →
                            </a>
                        </p>
                    `;
                } else if (data.code === 'INVALID_CREDENTIALS') {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ LOGIN FAILED</strong><br>
                        Invalid credentials. Check username/password.<br>
                        <div class="code">${JSON.stringify(data, null, 2)}</div>
                    `;
                } else if (data.code === 'DB_ERROR') {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>💥 DATABASE ERROR</strong><br>
                        ${data.error}<br>
                        <div class="code">${JSON.stringify(data, null, 2)}</div>
                        <p style="margin-top: 15px;">
                            <strong>Check:</strong> POSTGRES_URL environment variable in Vercel
                        </p>
                    `;
                } else {
                    resultDiv.className = 'result info';
                    resultDiv.innerHTML = `
                        <strong>ℹ️ UNEXPECTED RESPONSE</strong><br>
                        Status: ${response.status}<br>
                        <div class="code">${JSON.stringify(data, null, 2)}</div>
                    `;
                }

            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>🔥 REQUEST FAILED</strong><br>
                    ${error.message}<br>
                    <div class="code">${error.stack}</div>
                    <p style="margin-top: 15px;">
                        <strong>Possible causes:</strong><br>
                        • Network error / CORS issue<br>
                        • API endpoint not deployed yet<br>
                        • Vercel deployment failed
                    </p>
                `;
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '🚀 Test Login';
            }
        });

        // Auto-test on page load (optional)
        // setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
    </script>
</body>
</html>
